<section class="qp-online" id="quiz-online" lang="zh-Hans">
  <header class="qp-online-header">
    <button type="button" class="qp-online-brand" data-qpa="home">
      <span class="qp-online-mark">?</span><span data-qpi="brand">问答派对</span><kbd>Q</kbd>
    </button>
    <div class="qp-online-header-actions">
      <button type="button" class="qp-btn small" data-qpa="language">
        <span data-qpi="language">简中</span> <kbd>W</kbd>
      </button>
      <button type="button" class="qp-btn small" data-qpa="settings" data-qpi="settings">
        设置 <kbd>E</kbd>
      </button>
      <span class="qp-status" data-qpi="connection"><span class="qp-dot offline"></span>离线</span>
      <button type="button" class="qp-btn small" data-qpa="unlock" data-qpi="unlock">
        管理员解锁 <kbd>R</kbd>
      </button>
      <button type="button" class="qp-btn small" data-qpa="fullscreen">全屏 <kbd>T</kbd></button>
    </div>
  </header>
  <main class="qp-online-shell" data-qp-root></main>
</section>
